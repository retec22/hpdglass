<!doctype html><html lang="es-PE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HPD | Mi cuenta</title><link rel="stylesheet" href="../css/styles.css"><link rel="stylesheet" href="../css/design-v33.css"><style>body{background:#f4f8fa}.portal{max-width:980px;margin:auto;padding:32px}.portal-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dce6ea;padding-bottom:20px}.portal-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px}.portal-card{padding:24px;border:1px solid #dce6ea;border-radius:16px;background:#fff}.portal-card h2{margin-top:0}.portal-form{display:grid;gap:10px}.portal-form input,.portal-form textarea{padding:11px;border:1px solid #d5e2e6;border-radius:8px;font:inherit}.portal-form button{padding:12px;border:0;border-radius:9px;background:#08b9d8;color:#03202a;font-weight:800}.quote{padding:12px 0;border-bottom:1px solid #e8eef0}.chat{min-height:160px;max-height:260px;overflow:auto}.message{padding:9px 12px;border-radius:12px;background:#e8f8fa;margin:7px 0}.muted{color:#62737b;font-size:12px}@media(max-width:700px){.portal{padding:20px}.portal-head{display:block}.portal-grid{grid-template-columns:1fr}}
</style></head><body><main class="portal"><header class="portal-head"><div><span class="section-kicker">HPD GLASSGROUP</span><h1>Mi cuenta</h1><p class="muted" id="user-name"></p></div><button id="logout">Cerrar sesión</button></header><div class="portal-grid"><section class="portal-card"><h2>Mis cotizaciones</h2><div id="quotes" class="muted">Cargando...</div><form id="quote-form" class="portal-form"><input name="title" placeholder="Título de la cotización" required><textarea name="details" placeholder="Describe lo que necesitas" required></textarea><button>Crear cotización</button></form></section><section class="portal-card"><h2>Hablar con HPD</h2><div id="chat" class="chat muted">Cargando...</div><form id="message-form" class="portal-form"><textarea name="body" placeholder="Escribe tu mensaje" required></textarea><button>Enviar mensaje</button></form></section></div></main><script>
const token=localStorage.getItem('hpd.auth.token');if(!token)location.href='./';const headers={'Content-Type':'application/json',Authorization:`Bearer ${token}`};const get=async path=>(await fetch(path,{headers})).json();const render=async()=>{const me=await get('../api/auth/me');document.querySelector('#user-name').textContent=me.user?`${me.user.name} · ${me.user.company||'Cliente'}`:'';const quotes=await get('../api/portal/quotes');document.querySelector('#quotes').innerHTML=quotes.quotes?.length?quotes.quotes.map(q=>`<div class="quote"><strong>${q.title}</strong><br><span class="muted">${q.status}</span><p>${q.details}</p></div>`).join(''):'Aún no tienes cotizaciones.';const messages=await get('../api/portal/messages');document.querySelector('#chat').innerHTML=messages.messages?.length?messages.messages.map(m=>`<div class="message">${m.body}</div>`).join(''):'Inicia una conversación con HPD.'};document.querySelector('#quote-form').addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));await fetch('../api/portal/quotes',{method:'POST',headers,body:JSON.stringify(data)});e.target.reset();render()});document.querySelector('#message-form').addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));await fetch('../api/portal/messages',{method:'POST',headers,body:JSON.stringify(data)});e.target.reset();render()});document.querySelector('#logout').addEventListener('click',()=>{localStorage.removeItem('hpd.auth.token');localStorage.removeItem('hpd.auth.user');location.href='./'});render();
</script></body></html>
