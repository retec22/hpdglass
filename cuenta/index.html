<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HPD | Acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css"><link rel="stylesheet" href="../css/design-v33.css">
<style>
.account-shell{min-height:100vh;display:grid;place-items:center;padding:clamp(20px,5vw,64px);position:relative;overflow:hidden;background:linear-gradient(120deg,rgba(3,20,28,.96),rgba(4,45,57,.78)),url("https://www.hpdglass.com/wp-content/uploads/2025/04/Banner-principal-min_11zon.webp") center/cover no-repeat}.account-shell:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 82% 18%,rgba(8,185,216,.32),transparent 30%),linear-gradient(90deg,rgba(4,21,29,.45),transparent);pointer-events:none}.account-panel{position:relative;z-index:1;width:min(500px,100%);padding:clamp(24px,5vw,44px);border:1px solid rgba(121,228,240,.3);border-radius:24px;background:rgba(246,251,252,.94);box-shadow:0 28px 90px rgba(3,20,28,.4);backdrop-filter:blur(14px)}.account-panel:before{content:"";display:block;width:48px;height:4px;margin-bottom:22px;background:#08b9d8;border-radius:4px}.account-panel h1{margin:10px 0 26px;color:#061823;font-size:clamp(1.7rem,4vw,2.35rem);line-height:1.08;letter-spacing:-.02em}.account-tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:22px;padding:5px;border:1px solid #cfe1e5;border-radius:12px;background:#eaf3f5}.account-tabs button{min-height:42px;border:0;border-radius:8px;background:transparent;color:#52717a;font:700 12px "Montserrat",sans-serif;cursor:pointer;transition:.2s ease}.account-tabs button:hover{color:#061823}.account-tabs button.active{background:#08b9d8;color:#05232c;box-shadow:0 5px 14px rgba(8,185,216,.22)}.account-form{display:grid;gap:14px}.account-form label{display:grid;gap:7px;color:#52656c;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.account-form input{padding:13px 14px;border:1px solid #cbdde1;border-radius:9px;background:#fff;color:#061823;font:500 13px "Montserrat",sans-serif;outline:0;transition:.2s ease}.account-form input:focus{border-color:#08b9d8;box-shadow:0 0 0 3px rgba(8,185,216,.14)}.account-form button[type=submit]{margin-top:4px;padding:14px;border:0;border-radius:10px;background:linear-gradient(135deg,#08b9d8,#72dce7);color:#03202a;font:800 12px "Montserrat",sans-serif;cursor:pointer;box-shadow:0 10px 20px rgba(8,185,216,.2)}.account-message{min-height:20px;margin:14px 0 0;color:#b14c3c;font-size:12px}.account-links{display:flex;justify-content:space-between;gap:16px;margin-top:22px;padding-top:18px;border-top:1px solid #dce8ea;font-size:11px}.account-links a{color:#087e94;font-weight:700}.hidden{display:none!important}@media(max-width:520px){.account-shell{padding:14px}.account-panel{border-radius:18px}.account-links{display:grid;gap:10px}}
</style>
<style>
.account-shell{min-height:100vh;padding:24px;background:#142ed0;display:grid;place-items:center}
.account-shell:after{display:none}
.account-card{position:relative;z-index:1;width:min(760px,100%);display:grid;grid-template-columns:.82fr 1.18fr;background:#fff;box-shadow:0 24px 70px rgba(5,18,105,.34);overflow:hidden}
.account-visual{position:relative;min-height:480px;background:#10204c;overflow:hidden}
.account-photo-wrap{width:100%;height:100%;background:url("https://www.hpdglass.com/wp-content/uploads/2025/04/Banner-principal-min_11zon.webp") center/cover no-repeat}
.account-photo-wrap img{width:100%;height:100%;display:block;object-fit:cover;opacity:0}
.account-visual:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,15,43,.08),rgba(5,15,43,.72))}
.account-visual-copy{position:absolute;left:24px;right:24px;bottom:24px;z-index:1;color:#fff}
.account-visual-copy .section-kicker{font-size:10px;letter-spacing:.12em}
.account-visual-copy h2{font-size:1.35rem;line-height:1.08;margin:8px 0 0}
.account-panel{width:auto;min-width:0;padding:38px 34px;border:0;border-radius:0;background:#fff;box-shadow:none;backdrop-filter:none}
.account-panel:before{width:42px;height:4px;margin-bottom:18px}
.account-panel h1{font-size:clamp(1.6rem,3vw,2.1rem);margin:8px 0 22px}
.account-tabs{margin-bottom:20px}
@media(max-width:600px){.account-shell{padding:14px}.account-card{grid-template-columns:1fr;width:min(360px,100%)}.account-visual{min-height:150px;max-height:190px}.account-visual-copy{left:18px;bottom:18px}.account-visual-copy h2{font-size:1.05rem}.account-panel{padding:26px 22px}}
</style>
<style>
.account-panel,.account-panel button,.account-panel input,.account-panel label{font-family:"Roboto",sans-serif}
</style>
</head>
<body><main class="account-shell"><section class="account-card"><div class="account-visual"><div class="account-photo-wrap"><img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=900&q=80" alt="Persona trabajando en proyecto de vidrio y fachada"></div><div class="account-visual-copy"><span class="section-kicker">HPD GLASSGROUP</span><h2>Soluciones de vidrio y fachada hechas para arquitectura.</h2></div></div><div class="account-panel"><div class="account-header"><span class="section-kicker">HPD</span><h1 id="account-title">Ingresa a tu cuenta</h1></div><div class="account-tabs"><button class="active" data-mode="login">Inicio</button><button data-mode="register">Registro</button></div><form class="account-form" id="account-form"><label>Correo<input name="email" type="email" autocomplete="email" required placeholder="tu@correo.com"></label><label>Contraseña<input name="password" type="password" minlength="10" autocomplete="current-password" required placeholder="••••••••••"></label><div id="register-fields" class="hidden"><label>Nombre completo<input name="name" maxlength="160" placeholder="Nombre completo"></label><label>Empresa<input name="company" maxlength="200" placeholder="Empresa"></label><label>RUC<input name="tax_id" maxlength="32" placeholder="RUC"></label><label>Teléfono<input name="phone" maxlength="64" placeholder="Teléfono"></label></div><button type="submit" id="account-submit">Ingresar</button></form><p class="account-message" id="account-message"></p><div class="account-links"><a href="../">Volver al sitio</a><a href="../contacto/">Solicitar asesoría</a></div></div></section></main><script>
const form=document.querySelector('#account-form'),message=document.querySelector('#account-message'),fields=document.querySelector('#register-fields'),title=document.querySelector('#account-title'),submit=document.querySelector('#account-submit'),apiBase=location.hostname==='127.0.0.1'||location.hostname==='localhost'?'http://127.0.0.1:8080':'';let mode=new URLSearchParams(location.search).get('mode')==='register'?'register':'login';const setMode=nextMode=>{mode=nextMode;document.querySelectorAll('[data-mode]').forEach(tab=>tab.classList.toggle('active',tab.dataset.mode===mode));fields.classList.toggle('hidden',mode==='login');title.textContent=mode==='login'?'Ingresa a tu cuenta':'Crea tu cuenta HPD';submit.textContent=mode==='login'?'Ingresar':'Registrarme';};setMode(mode);document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>setMode(button.dataset.mode)));form.addEventListener('submit',async event=>{event.preventDefault();message.textContent='';const data=Object.fromEntries(new FormData(form));try{const response=await fetch(`${apiBase}/api/auth/${mode}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const payload=await response.json();if(!response.ok)throw new Error(payload.error||'No se pudo completar la operación');localStorage.setItem('hpd.auth.token',payload.token);localStorage.setItem('hpd.auth.user',JSON.stringify(payload.user));location.href=payload.user.role==='admin'?'../dashboard/':'./portal.html';}catch(error){message.textContent=error.message;}});
</script><script>document.querySelectorAll('.account-tabs button').forEach(button=>{button.type='button';button.addEventListener('click',()=>document.querySelectorAll('.account-tabs button').forEach(tab=>tab.setAttribute('aria-selected',String(tab===button))));});</script></body></html>
