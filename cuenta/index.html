<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HPD | Acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css"><link rel="stylesheet" href="../css/design-v33.css">
<style>
.account-shell{min-height:100vh;display:grid;place-items:center;padding:32px;background:linear-gradient(135deg,#061823,#0b5262 55%,#dff7fb)}.account-panel{width:min(520px,100%);padding:34px;border:1px solid rgba(255,255,255,.3);border-radius:22px;background:rgba(255,255,255,.94);box-shadow:0 24px 80px rgba(3,20,28,.25)}.account-panel h1{margin:8px 0 24px;font-size:2rem}.account-tabs{display:flex;gap:8px;margin-bottom:20px}.account-tabs button{flex:1;padding:11px;border:1px solid #cddfe3;border-radius:9px;background:#fff;color:#0b7185;font-weight:700;cursor:pointer}.account-tabs button.active{background:#08b9d8;color:#05232c;border-color:#08b9d8}.account-form{display:grid;gap:12px}.account-form label{display:grid;gap:6px;font-size:11px;font-weight:700;color:#52656c}.account-form input{padding:12px;border:1px solid #d6e3e7;border-radius:8px;font:inherit}.account-form button{padding:13px;border:0;border-radius:10px;background:#08b9d8;color:#03202a;font-weight:800;cursor:pointer}.account-message{min-height:20px;margin:14px 0 0;color:#b14c3c;font-size:12px}.account-status{padding:12px;background:#eef9ec;border-radius:10px;color:#27623c}.account-links{display:flex;justify-content:space-between;margin-top:20px;font-size:12px}.hidden{display:none!important}
</style>
</head>
<body><main class="account-shell"><section class="account-panel"><span class="section-kicker">HPD GLASSGROUP</span><h1 id="account-title">Ingresa a tu cuenta</h1><div class="account-tabs"><button class="active" data-mode="login">Inicio</button><button data-mode="register">Registro</button></div><form class="account-form" id="account-form"><label>Correo<input name="email" type="email" autocomplete="email" required></label><label>Contraseña<input name="password" type="password" minlength="10" autocomplete="current-password" required></label><div id="register-fields" class="hidden"><label>Nombre completo<input name="name" maxlength="160"></label><label>Empresa<input name="company" maxlength="200"></label><label>RUC<input name="tax_id" maxlength="32"></label><label>Teléfono<input name="phone" maxlength="64"></label></div><button type="submit" id="account-submit">Ingresar</button></form><p class="account-message" id="account-message"></p><div class="account-links"><a href="../">Volver al sitio</a><a href="../contacto/">Solicitar asesoría</a></div></section></main><script>
const form=document.querySelector('#account-form'),message=document.querySelector('#account-message'),fields=document.querySelector('#register-fields'),title=document.querySelector('#account-title'),submit=document.querySelector('#account-submit');let mode='login';document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{mode=button.dataset.mode;document.querySelectorAll('[data-mode]').forEach(tab=>tab.classList.toggle('active',tab===button));fields.classList.toggle('hidden',mode==='login');title.textContent=mode==='login'?'Ingresa a tu cuenta':'Crea tu cuenta HPD';submit.textContent=mode==='login'?'Ingresar':'Registrarme';}));form.addEventListener('submit',async event=>{event.preventDefault();message.textContent='';const data=Object.fromEntries(new FormData(form));try{const response=await fetch(`/api/auth/${mode}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const payload=await response.json();if(!response.ok)throw new Error(payload.error||'No se pudo completar la operación');localStorage.setItem('hpd.auth.token',payload.token);localStorage.setItem('hpd.auth.user',JSON.stringify(payload.user));location.href=payload.user.role==='admin'?'../dashboard/':'./portal.html';}catch(error){message.textContent=error.message;}});
</script></body></html>
